services:
  redis:
    image: redis:7-alpine
    container_name: mopl-redis
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      - TZ=Asia/Seoul
      - REDIS_PASSWORD=${LOCAL_REDIS_PASSWORD:?LOCAL_REDIS_PASSWORD is required}
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --loglevel
      - warning
      - --requirepass
      - ${LOCAL_REDIS_PASSWORD:?LOCAL_REDIS_PASSWORD is required}
      - --logfile
      - /var/log/redis/redis-server.log
    volumes:
      - redis_data:/data
      - ./redis/logs:/var/log/redis
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
