services:
  postgres:
    image: postgres:16-alpine
    container_name: mopl-perf-postgres
    environment:
      POSTGRES_DB: mopl_perf
      POSTGRES_USER: mopl_perf
      POSTGRES_PASSWORD: ${PERF_POSTGRES_PASSWORD:?PERF_POSTGRES_PASSWORD is required}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - mopl_perf_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mopl_perf -d mopl_perf"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mopl-perf-redis
    environment:
      REDIS_PASSWORD: ${PERF_REDIS_PASSWORD:?PERF_REDIS_PASSWORD is required}
      TZ: Asia/Seoul
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --requirepass
      - ${PERF_REDIS_PASSWORD:?PERF_REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mopl_perf_postgres_data:
