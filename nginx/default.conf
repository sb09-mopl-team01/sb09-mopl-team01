map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;
    server_tokens off;

    # Route 53 Resolver. Cloud Map 레코드를 짧은 TTL로 다시 조회한다.
    resolver 169.254.169.253 valid=5s ipv6=off;
    resolver_timeout 2s;
    set $backend_host "app.mopl.local:8080";

    location / {
        proxy_pass http://$backend_host;

        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /api/sse {
        proxy_pass http://$backend_host;

        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header X-Accel-Buffering no;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ^~ /ws {
        proxy_pass http://$backend_host;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'OK';
    }

    location = /actuator/health {
        proxy_pass http://$backend_host/actuator/health/readiness;
    }

    location = /actuator/health/liveness {
        proxy_pass http://$backend_host/actuator/health/liveness;
    }

    location = /actuator/health/readiness {
        proxy_pass http://$backend_host/actuator/health/readiness;
    }
}
