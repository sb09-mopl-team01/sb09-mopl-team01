name: Mopl-dev

on:
  push:
    branches: [ "dev", "chore/aws-setup" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      image_path: ${{ steps.build-image.outputs.image_path }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant permission
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean assemble

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker Image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.AWS_ECR_REPOSITORY }}
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image_path=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT


  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@master
        env:
          IMAGE_PATH: ${{ needs.build-and-push.outputs.image_path }}
          ECR_REGISTRY: ${{ needs.build-and-push.outputs.ecr_registry }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          RDS_HOST: ${{ secrets.RDS_HOST }}
          RDS_PORT: 5432
          RDS_DB_NAME: postgres
          RDS_USERNAME: postgres
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          envs: IMAGE_PATH,ECR_REGISTRY,AWS_REGION,RDS_HOST,RDS_PORT,RDS_DB_NAME,RDS_USERNAME,RDS_PASSWORD,AWS_S3_BUCKET

          script: |
            set -e
            
            echo "===== DEBUG ====="
            echo "IMAGE=$IMAGE_PATH"
            echo "REGISTRY=$ECR_REGISTRY"
            echo "REGION=$AWS_REGION"
            
            echo "===== ECR LOGIN ====="
            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            
            echo "===== DEPLOY START ====="
            docker rm -f mopl-backend-apps || true
            
            docker pull "$IMAGE_PATH"
            
            docker run -d -p 8080:8080 --name mopl-backend-apps \
              -e SPRING_PROFILES_ACTIVE=dev \
              -e RDS_HOST="$RDS_HOST" \
              -e RDS_PORT="$RDS_PORT" \
              -e RDS_DB_NAME="$RDS_DB_NAME" \
              -e RDS_USERNAME="$RDS_USERNAME" \
              -e RDS_PASSWORD="$RDS_PASSWORD" \
              -e CLOUD_AWS_REGION_STATIC="$AWS_REGION" \
              -e CLOUD_AWS_S3_BUCKET="$AWS_S3_BUCKET" \
              "$IMAGE_PATH"
            
            docker image prune -f
            echo "===== DEPLOY SUCCESS ====="