on:
  push:
    branches: [ "dev", "chore/aws-setup" ] # 테스트용 브랜치 추가

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create .env file for build
        run: |
          echo "RDS_HOST=${{ secrets.RDS_HOST }}" >> .env
          echo "RDS_PORT=5432" >> .env
          echo "RDS_DB_NAME=postgres" >> .env
          echo "RDS_USERNAME=postgres" >> .env
          echo "RDS_PASSWORD=Moplteam01!" >> .env

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean assemble

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.AWS_ECR_REPOSITORY }}
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Execute Server Application via SSH (Docker Run)
        uses: appleboy/ssh-action@master
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_PASSWORD: ${{ steps.login-ecr.outputs.docker_password }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY, ECR_PASSWORD
          script: |
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_REGISTRY
            
            if [ "$(docker ps -qa -f name=mopl-backend-apps)" ]; then
                echo "> 기존 도커 컨테이너 종료 및 삭제"
                docker stop mopl-backend-apps
                docker rm mopl-backend-apps
                sleep 3
            fi
            
            echo "> 최신 이미지 Pull"
            docker pull $ECR_REGISTRY/${{ secrets.AWS_ECR_REPOSITORY }}:latest
            
            echo "> 신규 도커 컨테이너 배포 및 이륙"
            docker run -d -p 8080:8080 --name mopl-backend-apps \
            -e SPRING_PROFILES_ACTIVE=dev \
            -e RDS_HOST=${{ secrets.RDS_HOST }} \
            -e RDS_PORT=5432 \
            -e RDS_DB_NAME=postgres \
            -e RDS_USERNAME=postgres \
            -e RDS_PASSWORD=Moplteam01! \
            -e CLOUD_AWS_REGION_STATIC=${{ secrets.AWS_REGION }} \
            -e CLOUD_AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }} \
            $ECR_REGISTRY/${{ secrets.AWS_ECR_REPOSITORY }}:latest
            
            docker image prune -f