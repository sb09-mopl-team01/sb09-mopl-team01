name: MOPL Backend CD (Auto Deploy)

on:
  push:
    branches: [ "dev", "chore/aws-setup" ] # 테스트용 브랜치 추가

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create .env file for build
        run: |
          echo "RDS_HOST=${{ secrets.RDS_HOST }}" >> .env
          echo "RDS_PORT=5432" >> .env
          echo "RDS_DB_NAME=postgres" >> .env
          echo "RDS_USERNAME=postgres" >> .env
          echo "RDS_PASSWORD=Moplteam01!" >> .env

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean assemble

      - name: Transfer Build File to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar, !build/libs/*-plain.jar"
          target: "/home/ubuntu/mopl-build"
          strip_components: 2

      - name: Execute Server Application via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/mopl-build
            
            CURRENT_PID=$(lsof -t -i:8080)
            if [ -z "$CURRENT_PID" ]; then
              echo "> 현재 구동 중인 백엔드 서버가 없으므로 종료하지 않습니다."
            else
              echo "> 기존 백엔드 서버 프로세스 종료: $CURRENT_PID"
              kill -15 $CURRENT_PID
              sleep 5
            fi
            
            echo "> 신규 백엔드 어플리케이션 배포 시작"
            nohup java -jar *.jar \
            --spring.profiles.active=dev \
            --RDS_HOST=${{ secrets.RDS_HOST }} \
            --RDS_PORT=5432 \
            --RDS_DB_NAME=postgres \
            --RDS_USERNAME=postgres \
            --RDS_PASSWORD=Moplteam01! \
            > deploy.log 2>&1 &