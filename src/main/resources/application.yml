spring:
  application:
    name: mopl
  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc.batch_size: 1000
        order_inserts: true
        order_updates: true
  batch:
    jdbc:
      initialize-schema: never

  jackson:
    serialization:
      write-dates-as-timestamps: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true

  cache:
    type: redis

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-seconds: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:3600}
  refresh-token-validity-seconds: ${JWT_REFRESH_TOKEN_VALIDITY_SECONDS:604800}
  max-active-tokens: ${JWT_MAX_ACTIVE_TOKENS:1}

mopl:
  admin:
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:admin@mopl.com}
    password: ${ADMIN_PASSWORD:admin1234}
  external:
    timeout:
      connect-seconds: ${EXTERNAL_API_CONNECT_TIMEOUT_SECONDS:3}
      read-seconds: ${EXTERNAL_API_READ_TIMEOUT_SECONDS:5}
    tmdb:
      api-key: ${TMDB_API_KEY:}
      base-url: https://api.themoviedb.org/3
      image-base-url: https://image.tmdb.org/t/p/w500
      movie-path: /movie/popular
      tv-path: /tv/popular
      pages: ${TMDB_SYNC_PAGES:1}
    the-sports-db:
      api-key: ${THE_SPORTS_DB_API_KEY:}
      base-url: https://www.thesportsdb.com/api/v1/json
      league-id: ${THE_SPORTS_DB_LEAGUE_ID:}
      events-path: /{apiKey}/eventsnextleague.php

  content:
    batch:
      external-sync:
        cron: ${CONTENT_EXTERNAL_SYNC_CRON:0 0 3 * * *}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,X-XSRF-TOKEN,X-Requested-With}