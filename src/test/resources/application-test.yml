spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  file:
    upload-dir: build/test-uploads/images
  cloud:
    aws:
      s3:
        bucket: test-bucket
  datasource:
    url: jdbc:h2:mem:mopl-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  mail:
    username: test@example.invalid
    password: test-only-not-a-secret
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  batch:
    jdbc:
      initialize-schema: always
  flyway:
    enabled: false
  cache:
    type: simple
  sql:
    init:
      mode: never
  data:
    redis:
      host: localhost
      port: 6379
      password:

jwt:
  secret: bW9wbC10ZXN0LW9ubHktand0LXNlY3JldC1rZXktMzItYnl0ZXM=

mopl:
  external:
    tmdb:
      api-key: test-tmdb-api-key
    the-sports-db:
      api-key: test-sports-api-key
      league-id: test-league-id
  kafka:
    enabled: false
  outbox:
    relay-enabled: false

management:
  health:
    kafka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
