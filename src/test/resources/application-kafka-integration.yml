spring:
  file:
    upload-dir: build/test-uploads/images
  cloud:
    aws:
      s3:
        bucket: test-bucket
  datasource:
    url: jdbc:h2:mem:mopl-kafka-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  mail:
    username: test@example.invalid
    password: test-only-not-a-secret
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  batch:
    jdbc:
      initialize-schema: always
  flyway:
    enabled: false
  cache:
    type: simple
  data:
    redis:
      host: localhost
      port: 6379
      password:
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: io.mopl.infra.kafka.FailingPayloadDeserializer
    listener:
      auto-startup: true

jwt:
  secret: bW9wbC10ZXN0LW9ubHktand0LXNlY3JldC1rZXktMzItYnl0ZXM=

mopl:
  external:
    tmdb:
      api-key: test-tmdb-api-key
    the-sports-db:
      api-key: test-sports-api-key
      league-id: test-league-id
  kafka:
    enabled: true
  notification:
    delivery-mode: kafka
    kafka:
      topic: notification
      dlt-topic: notification-dlt
      group-id: notification-kafka-integration
      max-retries: 10
      retry-backoff: PT5S
  outbox:
    relay-enabled: false

management:
  health:
    kafka:
      enabled: false
